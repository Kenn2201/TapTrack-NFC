name: TapTrack CI

on:
  pull_request:
    branches:
      - kenn/develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Audit server dependencies
        run: npm audit

  client:
    name: Client tests, build, lint, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run client tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Lint client
        run: npm run lint

      - name: Audit client dependencies
        run: npm audit

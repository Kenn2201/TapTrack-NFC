name: TapTrack CI

on:
  pull_request:
    branches:
      - kenn/develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests, migrations, and audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taptrack
          POSTGRES_PASSWORD: taptrack
          POSTGRES_DB: taptrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taptrack -d taptrack_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Validate Drizzle migrations against PostgreSQL
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://taptrack:taptrack@127.0.0.1:5432/taptrack_ci
          AUTO_MIGRATE: "true"
          MIGRATION_QA_RESET: "true"
        run: npm run test:migrations

      - name: Run server tests
        run: npm test

      - name: Audit server dependencies
        run: npm audit

  client:
    name: Client tests, build, lint, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run client tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Lint client
        run: npm run lint

      - name: Audit client dependencies
        run: npm audit
